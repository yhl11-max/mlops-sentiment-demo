<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentiment demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
    textarea { width: 100%; height: 120px; padding: 12px; font-size: 16px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    #result { margin-top: 20px; padding: 16px; border-radius: 8px; background: #f4f4f4; }
    .positive { color: #137333; }
    .negative { color: #b00020; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Sentiment analysis</h1>
  <p>Enter a movie review:</p>
  <textarea id="text" placeholder="This movie was great..."></textarea>
  <button id="analyze">Analyze</button>
  <div id="result" hidden></div>

  <script>
    const button = document.getElementById('analyze');
    const textarea = document.getElementById('text');
    const result = document.getElementById('result');

    button.addEventListener('click', async () => {
      const text = textarea.value.trim();
      if (!text) {
        showError('Please enter some text.');
        return;
      }

      button.disabled = true;
      result.hidden = false;
      result.className = '';
      result.textContent = 'Analyzing...';

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const body = await response.json();

        if (!response.ok) {
          showError(body.detail || `Request failed (${response.status})`);
          return;
        }

        result.className = body.sentiment;
        result.innerHTML =
          `<strong>${body.sentiment}</strong><br>` +
          `confidence: ${body.confidence}<br>` +
          `text: ${escapeHtml(body.text)}`;
      } catch (error) {
        showError('Could not reach the server.');
      } finally {
        button.disabled = false;
      }
    });

    function showError(message) {
      result.hidden = false;
      result.className = 'error';
      result.textContent = message;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
      }[ch]));
    }
  </script>
</body>
</html>
