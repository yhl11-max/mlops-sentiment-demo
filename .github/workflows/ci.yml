name: CI Pipeline

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t mlops-sentiment-ci .

  deploy:
    name: Build environment image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_ENV=production" > .env
            echo "MODEL_PATH=/app/ml/model.joblib" >> .env
            echo "DVC_SAS_TOKEN=${{ secrets.PROD_DVC_SAS_TOKEN }}" >> .env
          else
            echo "APP_ENV=staging" > .env
            echo "MODEL_PATH=/app/ml/model.joblib" >> .env
            echo "DVC_SAS_TOKEN=${{ secrets.STAGING_DVC_SAS_TOKEN }}" >> .env
          fi
          test -s .env

      - name: Build Docker image
        run: docker build -t sentiment-app-${{ github.ref_name }} .
